<!--detalhes.html-->

{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dengue</title>
        <link rel="stylesheet" href="{% static 'protocolos/style.css' %}">
        <script src="{% static 'protocolos/js/calculadora.js' %}"></script>
        <script defer src="{% static 'protocolos/js/fluxograma.js' %}"></script>
        
    </head>

<body>

<div class="retangulo">

    <div class="header">
        <a href="{% url 'dashboard' %}">
            <button class="voltar-botton">&#8592;</button>
        </a>
        <h1>Protocolos</h1>
    </div>

    <div class="busca">
        <span class="icone-busca">🔎</span>
        <input type="text" placeholder="Buscar protocolos...">
    </div>

    <div class="agrupamento_de_opcoes">
        <button class="btn">
            <span>⚙️</span> Filtrar protocolos
        </button>
        <button class="btn" onclick="abrirCalculadora()">
            <span>🧮</span> Calculadora
        </button>
    </div>

    <div class="header">
        <a href="{% url 'protocolos' %}">
            <button class="voltar-botton">&#8592;</button>
        </a>
        <h1>Dengue</h1>
        <button class="estrela_de_favorito_2">⭐</button>
    </div>

    <div class="tabs">
        <button class="tab ativo" id="tab-detalhes"   onclick="mudarAba('detalhes')">📄 Detalhes</button>
        <button class="tab"       id="tab-fluxograma" onclick="mudarAba('fluxograma')">👤 Fluxograma</button>
    </div>



    <div class="tab-content ativo" id="conteudo-detalhes">
        <div class="cards_de_informacoes">
            <div class="cards_com_informacao">
                <div class="card_interno">Informações</div>
            </div>
            <div class="cards_com_informacao">
                <div class="card_interno">Informações</div>
            </div>
            <div class="cards_com_informacao">
                <div class="card_interno">Informações</div>
            </div>
            <div class="cards_com_informacao">
                <div class="card_interno">Informações</div>
            </div>
        </div>
    </div>

    <div class="tab-content" id="conteudo-fluxograma">
 
        <!-- Barra: Resetar + Contador -->
        <div class="fluxograma-header">
            <button class="btn-resetar" onclick="resetarFluxograma()">🔄 Resetar</button>
            <div class="progresso-contador">
                <span>⏱</span>
                <span id="texto-progresso">0 / 4 concluídos</span>
            </div>
        </div>
 
        <!-- Cards conectados por setas — gerados pelo JS -->
        <div class="fluxograma-lista" id="lista-fluxograma"></div>
 
    </div>

</div>

<div id="modal-calculadora" class="modal-overlay" style="display:none;">
    <div class="modal-box">

        <button class="modal-fechar" onclick="fecharCalculadora()">✕</button>

        <h2><span>🧮</span> Calculadora de dosagens</h2>
        <p class="modal-subtitulo">Preencha com os dados do paciente e selecione a medicação desejada para receber a informação de dosagem correta</p>

        <h3>Dados do paciente</h3>

        <div class="campo">
            <label>Peso (kg) *</label>
            <input type="number" placeholder="Ex: 20.2" id="peso">
        </div>

        <div class="campo">
            <label>Altura (cm) *</label>
            <input type="number" placeholder="Ex: 100" id="altura">
        </div>


        <div class="campo">
            <label>Medicação *</label>
            <select id="medicacao">
                <option value="">Selecione</option>
                <option value="med1">Medicação 1</option>
                <option value="med2">Medicação 2</option>
            </select>
        </div>

        <div class="modal-botoes">
            <button class="btn-calcular" onclick="calcular()"><span>🧮</span> Calcular</button>
            <button class="btn-limpar" onclick="limpar()"><span>🗑️</span> Limpar</button>
        </div>

    </div>
</div>

</body>
</html>
