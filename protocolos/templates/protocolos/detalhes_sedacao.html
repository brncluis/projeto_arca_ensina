<body data-page="detalhe">

                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" placeholder="Buscar protocolos..." oninput="buscarProtocolo(this.value)">

        <button id="abrirFiltro" class="btn-filtrar">

        <div class="calculadora_icone" onclick="abrirCalculadora()">

            </div>
        </div>
    </div>


    <div class="tabs2">
        <button class="tab ativo2" id="tab-detalhes"   onclick="mudarAba('detalhes')">Detalhes</button>
        <a href="{% url 'fluxograma_sedacao' %}" class="tab2">Fluxograma</a>
    </div>



        <div class="sub_header2" data-categoria="infectologia" data-ordem="1">
            <div class="sub_header_interna2">
                <div class="sub_header_interna_interna2">
                    Informações
                </div>
            </div>
        </div>

        <div class="sub_header2" data-categoria="infectologia" data-ordem="1">

                    Informações
                </div>
            </div>
        </div>
</div>

<div id="modal-calculadora" class="modal-overlay" style="display:none;">
    <div class="modal-box">

        <button class="modal-fechar" onclick="fecharCalculadora()">✕</button>

        <h2><span></span> Calculadora de dosagens</h2>
        <p class="modal-subtitulo">Preencha com os dados do paciente e selecione a medicação desejada para receber a informação de dosagem correta</p>

        <h3>Dados do paciente</h3>

        <div class="campo">
            <label>Peso (kg) *</label>
            <input type="number" placeholder="Ex: 20.2" id="peso">
        </div>

        <div class="campo">
            <label>Altura (cm) *</label>
            <input type="number" placeholder="Ex: 100" id="altura">
        </div>


        <div class="campo">
            <label>Medicação *</label>
            <select id="medicacao">
                <option value="">Selecione</option>
                <option value="med1">Medicação 1</option>
                <option value="med2">Medicação 2</option>
            </select>
        </div>

        <div class="modal-botoes">
            <button class="btn-calcular" onclick="calcular()"><span></span> Calcular</button>
            <button class="btn-limpar" onclick="limpar()"><span></span> Limpar</button>
        </div>

    </div>
</div>
