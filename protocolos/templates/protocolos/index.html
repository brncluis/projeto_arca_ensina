<!--index.html-->

{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocolos</title>
    <link rel="stylesheet" href="{% static 'protocolos/style.css' %}">
    <link rel="stylesheet" href="{% static 'protocolos/modal.css' %}">
</head>


<body data-page="lista">

<div class="container">


    <div class="header">
        <a href="{% url 'dashboard' %}">
            <button class="voltar-botton">
                <span class= "seta"></span>
            </button>
        </a>

        <h1 class="titulo">Protocolos</h1>
    </div>

    <div class="busca-container">
        <div class="busca">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2c2c2c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="text" placeholder="Buscar protocolos..." oninput="buscarProtocolo(this.value)">
            </div>

        <button id="abrirFiltro" class="btn-filtrar">
            Filtrar protocolos
        </button>
    </div>

    <div class="tabs">
        <button class="tab ativo">Todos</button>
        <button class="tab">Favoritos</button>
        <button class="tab">Recentes</button>
    </div>

    <div id="lista-protocolos">

    {% if mensagem %}
        <p>{{ mensagem }}</p>
    {% endif %}

    {% for protocolo in protocolos %}

        <a href="
            {% if protocolo.titulo == 'Dengue' %} 
                {% url 'detalhes_do_protocolo' %}
            {% elif protocolo.titulo == 'Sedação' %}
                {% url 'detalhes_sedacao' %} 
            {% endif %}" 
            style="text-decoration: none;">

            <div class="sub_header">

                <div class="sub_header_interna">

                    <div class="primeiro_card">
                        <h2>{{ protocolo.titulo }}</h2>

                        <button class="estrela_de_favorito">
                            ⭐
                        </button>
                    </div>

                    <div class="sub_header_interna_interna">
                        {{ protocolo.descricao }}
                    </div>

                </div>

            </div>

        </a>

    {% empty %}

        <p>Nenhum protocolo encontrado.</p>

    {% endfor %}

</div> 

</div> 



    <!-- Modal do filtro -->
    {% include 'protocolos/components/filtro_modal.html' %}

    <script defer src="{% static 'protocolos/js/filtro.js' %}"></script>
    <script defer src="{% static 'protocolos/js/modalFiltro.js' %}"></script>

    <script>
    function buscarProtocolo(termo) {
        const t = termo.toLowerCase();
        document.querySelectorAll(".sub_header").forEach(card => {
            const nome = card.querySelector("h2")?.textContent.toLowerCase() || "";
            card.style.display = nome.includes(t) ? "" : "none";
        });
    }
    </script>


</body>
</html>
