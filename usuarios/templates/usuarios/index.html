{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumus</title>
    <link rel="stylesheet" href="{% static 'usuarios/usuarios.css' %}">
    
</head>
<body>
    
    <main>

        <section class = "login-section">
            <div class = "container">
                
                <div class="circulo">
                    <span>LOGO</span>
                </div>

                <div class = "login-card">
                    <h1 class = "titulo">Acesse sua conta</h1>

                    {% if erro %}
                    <div class = "login-error">
                        ⚠️ {{ erro }}
                    </div>
                    {% endif %}

                    <!--FORMULÁRIO-->

                    <form method="post">
                        {% csrf_token %}

                        <div class = "form-group">
                            <label for = "id_acesso">ID</label>
                            <input
                                type = "text"
                                id = "id_acesso"
                                name = "id_acesso"
                                placeholder="Seu ID de acesso"
                                required
                            >
                        </div>

                        <div class="form-group">

                                <label for="password">
                                    Senha
                                </label>

                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    placeholder="Sua senha"
                                    required
                                >

                                <a href="#" class="link-forgot">
                                    Esqueceu sua senha?
                                </a>

                        </div>

                        <button type="submit" class="btn-primary btn-full">
                            Entrar
                        </button>
                    </form>

                    <p class="login-signup">
                        Ainda não tem conta?
                        <a href="{% url 'register' %}">Cadastre-se Já!</a>
                    </p>
                </div>

            </div>

        </section>



        

    </main>



</body>
</html>
